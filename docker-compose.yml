x-service-environment: &service-environment
  AUTH_BASE_URL: http://auth-service:3001
  JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the root .env}
  JWT_PUBLIC_KEY_PATH: /app/public-keys/auth-public.pem
  BOOKING_TO_PET_TOKEN: ${BOOKING_TO_PET_TOKEN:?Set BOOKING_TO_PET_TOKEN in the root .env}

x-public-keys: &public-keys
  type: volume
  source: jwt_public_keys
  target: /app/public-keys
  read_only: true

services:
  jwt-keys-init:
    image: node:22-bookworm-slim
    network_mode: none
    command: ["node", "/init-jwt-keys.cjs"]
    volumes:
      - ./docker/init-jwt-keys.cjs:/init-jwt-keys.cjs:ro
      - ./Backend/auth-service/keys:/keys
      - jwt_public_keys:/public-keys

  auth-mongodb:
    image: mongo:8.0
    volumes:
      - auth_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./Backend/auth-service
    command: ["sh", "-c", "node scripts/seed-staff.js && exec node server.js"]
    env_file:
      - path: ./Backend/auth-service/.env
        required: false
        format: raw
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://auth-mongodb:27017/pawstay_auth
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the root .env}
      JWT_PRIVATE_KEY_PATH: /auth-keys/private.pem
      FACILITY_CONTACT_FILE: /app/data/facility-contact.json
      JWT_PUBLIC_KEY_PATH: /app/public-keys/auth-public.pem
    volumes:
      - *public-keys
      - ./Backend/auth-service/keys:/auth-keys:ro
      - ./Backend/auth-service/scripts/seed-staff.js:/app/scripts/seed-staff.js:ro
      - ./Backend/auth-service/scripts/data/staff.json:/app/scripts/data/staff.json:ro
      - facility_contact_data:/app/data
    depends_on:
      jwt-keys-init:
        condition: service_completed_successfully
      auth-mongodb:
        condition: service_healthy

  booking-mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "pawstay-demo", "--bind_ip_all"]
    volumes:
      - booking_mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --eval
        - >-
          try { rs.status(); } catch (error) {
            if (error.code !== 94) throw error;
            rs.initiate({_id:'pawstay-demo',members:[{_id:0,host:'booking-mongodb:27017'}]});
          }
          quit(db.hello().isWritablePrimary && db.hello().setName === 'pawstay-demo' ? 0 : 1);
      interval: 3s
      timeout: 5s
      retries: 20

  pet-service:
    build: ./Backend/pet-service
    environment:
      <<: *service-environment
      PORT: 3002
      MONGODB_URI: mongodb://booking-mongodb:27017/pet_db?replicaSet=pawstay-demo
    volumes:
      - *public-keys
    depends_on:
      auth-service:
        condition: service_healthy
      booking-mongodb:
        condition: service_healthy

  booking-service:
    build: ./Backend/booking-service
    command: ["sh", "-c", "node scripts/seed-resources.js && exec node server.js"]
    environment:
      <<: *service-environment
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      PAWSTAY_DEMO_ENABLED: ${PAWSTAY_DEMO_ENABLED:-false}
      MONGODB_URI: mongodb://booking-mongodb:27017/booking_db?replicaSet=pawstay-demo
      PET_BASE_URL: http://pet-service:3002
      CATALOG_MODE: http
      CATALOG_BASE_URL: http://catalog-service:3004
      BOOKING_TO_CATALOG_TOKEN: ${BOOKING_TO_CATALOG_TOKEN:?Set BOOKING_TO_CATALOG_TOKEN in the root .env}
      PAYMENT_TO_BOOKING_TOKEN: ${PAYMENT_TO_BOOKING_TOKEN:?Set PAYMENT_TO_BOOKING_TOKEN in the root .env}
      CARE_TO_BOOKING_TOKEN: ${CARE_TO_BOOKING_TOKEN:?Set CARE_TO_BOOKING_TOKEN in the root .env}
    volumes:
      - *public-keys
    depends_on:
      auth-service:
        condition: service_healthy
      booking-mongodb:
        condition: service_healthy
      pet-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  payment-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment_app
      MYSQL_PASSWORD: ${PAYMENT_MYSQL_PASSWORD:?Set PAYMENT_MYSQL_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_MYSQL_ROOT_PASSWORD:?Set PAYMENT_MYSQL_ROOT_PASSWORD in the root .env}
    volumes:
      - payment_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  payment-service:
    build: ./Backend/payment-service
    env_file:
      - path: ./Backend/payment-service/.env
        required: false
        format: raw
    environment:
      PAYMENT_PORT: 8084
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:${GATEWAY_HOST_PORT:-8080}/api/payments/vnpay/return}
      PAYMENT_FRONTEND_RETURN_URL: ${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:5173/payments/return}
      PAYMENT_DB_URL: jdbc:mysql://payment-mysql:3306/payment_db?allowPublicKeyRetrieval=true
      PAYMENT_DB_USERNAME: payment_app
      PAYMENT_DB_PASSWORD: ${PAYMENT_MYSQL_PASSWORD:?Set PAYMENT_MYSQL_PASSWORD in the root .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the root .env}
      JWT_PUBLIC_KEY_PATH: /app/public-keys/auth-public.pem
      BOOKING_SERVICE_URL: http://booking-service:3003
      PAYMENT_TO_BOOKING_TOKEN: ${PAYMENT_TO_BOOKING_TOKEN:?Set PAYMENT_TO_BOOKING_TOKEN in the root .env}
    volumes:
      - *public-keys
    depends_on:
      auth-service:
        condition: service_healthy
      payment-mysql:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "true </dev/tcp/127.0.0.1/8084"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-service:
    build: ./Backend/catalog-service
    command: ["sh", "-c", "node scripts/seed.js && exec node server.js"]
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://booking-mongodb:27017/catalog_db?replicaSet=pawstay-demo
      AUTH_BASE_URL: http://auth-service:3001
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the root .env}
      JWT_PUBLIC_KEY_PATH: /app/public-keys/auth-public.pem
      BOOKING_TO_CATALOG_TOKEN: ${BOOKING_TO_CATALOG_TOKEN:?Set BOOKING_TO_CATALOG_TOKEN in the root .env}
    volumes:
      - *public-keys
    depends_on:
      auth-service:
        condition: service_healthy
      booking-mongodb:
        condition: service_healthy

  care-service:
    build: ./Backend/care-service
    environment:
      PORT: 3006
      NODE_ENV: ${NODE_ENV:-development}
      PAWSTAY_DEMO_ENABLED: ${PAWSTAY_DEMO_ENABLED:-false}
      MONGODB_URI: mongodb://booking-mongodb:27017/care_db?replicaSet=pawstay-demo
      AUTH_BASE_URL: http://auth-service:3001
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the root .env}
      JWT_PUBLIC_KEY_PATH: /app/public-keys/auth-public.pem
      BOOKING_BASE_URL: http://booking-service:3003
      CARE_TO_BOOKING_TOKEN: ${CARE_TO_BOOKING_TOKEN:?Set CARE_TO_BOOKING_TOKEN in the root .env}
    volumes:
      - *public-keys
    depends_on:
      auth-service:
        condition: service_healthy
      booking-mongodb:
        condition: service_healthy
      booking-service:
        condition: service_healthy

  api-gateway:
      image: nginx:1.28-alpine
      ports:
        - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
      volumes:
        - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        auth-service:
          condition: service_healthy
        pet-service:
          condition: service_healthy
        booking-service:
          condition: service_healthy
        payment-service:
          condition: service_healthy
        catalog-service:
          condition: service_healthy
        care-service:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
        interval: 5s
        timeout: 3s
        retries: 10
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.4.0
    profiles: [monitoring]
    entrypoint: ["/bin/sh", "-ec", ': "$${GF_SECURITY_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env}"; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  prometheus_data:
  grafana_data:
  facility_contact_data:
  jwt_public_keys:
  auth_mongo_data:
  booking_mongo_data:
  payment_mysql_data:
