log_format gateway '$remote_addr "$request_method $uri" $status $request_time';

map $uri $backend {
    default "";
    ~^/api/auth/(register|login|me)/?$ auth-service:3001;
    ~^/api/pets(?:/|$) pet-service:3002;
    ~^/api/(?:bookings|staff)(?:/|$) booking-service:3003;
    ~^/api/payments(?:/|$) payment-service:8084;
    ~^/api/catalog(?:/|$) catalog-service:3004;
    ~^/api/care(?:/|$) care-service:3006;
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout gateway;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        if ($backend = "") {
            return 404;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Service-Token "";
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_pass http://$backend;
    }
}
