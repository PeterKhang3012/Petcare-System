log_format gateway '$remote_addr "$request_method $uri" $status $request_time';

map $uri $documentation_backend {
    default "";
    /docs-api/auth auth-service:3001/api-docs.json;
    /docs-api/pet pet-service:3002/api-docs.json;
    /docs-api/booking booking-service:3003/api-docs.json;
    /docs-api/catalog catalog-service:3004/api-docs.json;
    /docs-api/care care-service:3006/api-docs.json;
    /docs-api/payment payment-service:8084/v3/api-docs;
}

map $uri $backend {
    default "";
    ~^/api/auth/(register|login|me)/?$ auth-service:3001;
    ~^/api/auth/staff/bookings/[^/]+/contact/?$ auth-service:3001;
    ~^/api/facility/contact/?$ auth-service:3001;
    ~^/api/pets(?:/|$) pet-service:3002;
    ~^/api/(?:bookings|staff)(?:/|$) booking-service:3003;
    ~^/api/payments(?:/|$) payment-service:8084;
    ~^/api/catalog(?:/|$) catalog-service:3004;
    ~^/api/care(?:/|$) care-service:3006;
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout gateway;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /docs-api/ {
        if ($documentation_backend = "") {
            return 404;
        }
        limit_except GET { deny all; }
        proxy_set_header Authorization "";
        proxy_set_header X-Service-Token "";
        proxy_pass http://$documentation_backend;
    }

    location / {
        if ($backend = "") {
            return 404;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Service-Token "";
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_pass http://$backend;
    }
}
