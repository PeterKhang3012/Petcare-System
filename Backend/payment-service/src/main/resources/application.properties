spring.application.name=payment-service
server.port=${PAYMENT_PORT:8084}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

booking.service.base-url=${BOOKING_SERVICE_URL:}
booking.service.internal-token=${PAYMENT_TO_BOOKING_TOKEN:}
auth.service.base-url=${AUTH_SERVICE_URL:}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
jwt.issuer=${JWT_ISSUER:}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:} 
payment.frontend-return-url=${PAYMENT_FRONTEND_RETURN_URL:}
payment.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
payment.outbox.retry-delay-ms=${OUTBOX_RETRY_DELAY:5000}
# Chưa có frontend nên tạm thời để trống vnpay.return-url=${VNPAY_RETURN_URL:}
# vnpay.ipn-url=${VNPAY_IPN_URL:} 
# payment.frontend-return-url=${PAYMENT_FRONTEND_RETURN_URL:}, khi nào có frontend thì sẽ update lại
spring.config.import=optional:file:.env[.properties]
spring.jackson.deserialization.fail-on-unknown-properties=true
auth.service.base-url=${AUTH_SERVICE_URL:}
payment.outbox.enabled=${OUTBOX_ENABLED:true}
payment.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:12}
payment.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY:1000}
